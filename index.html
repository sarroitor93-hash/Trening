<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trening</title>
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column built for one hand at the gym; sticky header with session tabs, slots as stacked blocks, rest timer pinned to the bottom. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#e3e7eb; --fg:#15191e; --muted:#5d6670; --line:#d3d9df;
  --accent:#1f5fbf; --accent-fg:#ffffff; --done:#1d8a4e; --done-bg:#dff2e7; --warn:#b06a00; --warn-bg:#fdf0d9; --danger:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101317; --surface:#181c21; --surface-2:#22272e; --fg:#e8ecf0; --muted:#98a2ad; --line:#2c333b;
  --accent:#5b97ef; --accent-fg:#0b1220; --done:#4cc785; --done-bg:#16301f; --warn:#f0b04a; --warn-bg:#33270f; --danger:#f28b82; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 96px}
.wrap{max-width:560px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand-r{display:flex;align-items:center;gap:10px}
.gear{border:0;background:var(--surface-2);border-radius:999px;width:38px;height:38px;font-size:20px;line-height:1;color:var(--fg)}
.sync{font-size:12px;color:var(--muted)}
.sync.err{color:var(--danger)}
.setup{display:grid;gap:12px}
.setup input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;font-size:15px}
.setup label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:var(--r);padding:4px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:8px 0;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{display:grid;gap:12px;padding-top:6px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{white-space:nowrap;border:0;background:transparent;border-radius:7px;min-width:44px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:0}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:12px}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.slot-h h2{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.rule{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rule.nofail{color:var(--warn)}
.ex{display:grid;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.slot-h + .ex{border-top:0;padding-top:0}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.target{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--surface-2);border-radius:var(--r);height:46px}
.stepper button{height:46px;border:0;background:transparent;font-size:24px;font-weight:500;color:var(--fg)}
.stepper button:active{background:var(--line);border-radius:var(--r)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:24px;padding:0}
.unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;display:block;margin-top:-2px}
.reps{width:112px}
.reps .stepper{grid-template-columns:34px minmax(0,1fr) 34px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:56px;height:48px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted)}
.set{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.set small{font-family:var(--body);font-size:11px;font-weight:600;margin-top:2px}
.set.on{border:1.5px solid var(--done);background:var(--done-bg);color:var(--done)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.up{color:var(--done);font-weight:600}
.tools{display:flex;align-items:center;gap:6px}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
.ex.skipped{opacity:.6}
.name{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:15px}
.primary{width:100%;border:0;border-radius:var(--r);padding:14px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.primary:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.card h2{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 0}
td{padding:6px 0;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.entry{display:grid;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.badge{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;padding:1px 8px;border-radius:6px;background:var(--surface-2);margin-right:6px}
.entry ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}
.del{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px}
.del.arm{color:var(--accent-fg);background:var(--danger);border-radius:999px;padding:4px 10px;font-weight:600}
.confirm{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.del[data-cancel]{border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.empty{color:var(--muted);font-size:14px;margin:0}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:4px}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.rest .t{font-family:var(--display);font-weight:700;font-size:28px}
.rest.over{background:var(--done-bg);border-top-color:var(--done)}
.rest.over .t{color:var(--done)}
.rest.over #rest-x{background:var(--done);color:#fff;border-color:var(--done)}
.rest-b{display:flex;gap:6px}
.rest-b .ghost{padding:8px 10px}
.restctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.restctl b{font-family:var(--display);font-size:18px;color:var(--fg);min-width:40px;text-align:center}
.restctl .mini{padding:2px 10px;font-size:15px}
.rest .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:7;max-width:calc(100% - 32px);text-align:center}
.tm-card .chips{flex-wrap:wrap;overflow:visible}
.tm-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tm-list li{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:14px}
.tm-list li b{font-family:var(--display);font-size:16px;min-width:20px;color:var(--muted)}
.tm-list li span{flex:1}
.tm-list li small{color:var(--muted);font-size:12px}
.timer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer.work{background:color-mix(in srgb,var(--done) 14%,var(--bg))}
.timer.rest,.timer.prep{background:color-mix(in srgb,var(--warn) 14%,var(--bg))}
.tm-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.tm-mid{text-align:center;display:grid;gap:6px}
.tm-phase{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tm-ex{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,48px);line-height:1.05;text-transform:uppercase}
.tm-reps{font-size:18px;color:var(--muted)}
.tm-clock{font-family:var(--display);font-weight:700;font-size:clamp(96px,32vw,180px);line-height:1}
.tm-next{font-size:16px;color:var(--muted)}
.tm-next b{color:var(--fg)}
.tm-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--accent)}
.tm-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tm-btns button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 0;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.set,.chip,.tabs button{transition:background .12s,color .12s,border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><h1>Trening</h1><span class="brand-r"><span class="sync" id="sync">Wczytuję arkusz…</span><button class="gear" id="open-settings" aria-label="Ustawienia">⚙</button></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="sila">Trening</button>
    <button role="tab" aria-selected="false" data-tab="bieg">Bieg</button>
    <button role="tab" aria-selected="false" data-tab="pomiar">Pomiar</button>
    <button role="tab" aria-selected="false" data-tab="hist">Historia</button>
  </nav>
</header>
<main id="main"></main>
</div>
<div class="rest" id="rest" hidden><div><div class="l" id="rest-l">Przerwa</div><div class="t num" id="rest-t">0:00</div></div><div class="rest-b"><button class="ghost" id="rest-m">−15 s</button><button class="ghost" id="rest-p">+15 s</button><button class="ghost" id="rest-x"><b>Stop</b></button></div></div>
<div class="toast" id="toast" hidden></div>
<div class="timer" id="timer" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n*10)/10).toString().replace(".",",");
const parse=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- Plan v1.2 ----------
const KLATKA=["Wyciskanie hantli – skos","Wyciskanie hantli – płasko","Wyciskanie na maszynie","Wyciskanie sztangi – płasko","Wyciskanie sztangi – skos"];
const PLECY=["Ściąganie drążka / linki","Wiosłowanie hantlą","Wiosłowanie linką (dół)","Podciąganie"];
const UGIN=["Uginanie nóg siedząc (maszyna)","Uginanie nóg leżąc (maszyna)"];
const PROST=["Prostowanie nóg (maszyna)"];
const NOGI=[...UGIN,...PROST,"RDL"];
const TYL=["Odwrotne rozpiętki (maszyna)","Odwrotne rozpiętki (hantle)","Face pull"];
const LYDKI=["Wznosy na łydki stojąc","Wznosy na łydki siedząc","Wznosy na łydki na suwnicy"];
const BOKI=["Odwodzenie linką","Odwodzenie hantlami","Odwodzenie na maszynie","Wyciskanie nad głowę – hantle","Wyciskanie nad głowę – maszyna"];
const ABS=["Brzuszki na maszynie","Unoszenie nóg w zwisie","Unoszenie kolan na poręczach","Kółko (ab wheel)","Deska (sek.)","Tabata brzuch (rundy)","Spięcia na linie"];
const BIC=["Uginanie – hantle","Uginanie – sztanga","Uginanie – linka"];
const TRI=["Prostowanie linką w dół","Prostowanie linką nad głową","Prostowanie jednorącz"];
const BW=["Podciąganie","Pompki","Pompki – nogi wyżej","Unoszenie nóg w zwisie","Unoszenie kolan na poręczach","Kółko (ab wheel)","Deska (sek.)","Tabata brzuch (rundy)"];
const ALL=[...new Set(["Rozpiętki (maszyna)","Martwy ciąg","RDL","Przysiad hack","Suwnica","Przysiad ze sztangą",...KLATKA,...PLECY,...NOGI,...BOKI,...BIC,...TRI,...ABS,"Wznosy na łydki","Odwrotne rozpiętki","Face pull","Hip thrust","Wykroki","Dipy"])];
function arms(){return {id:"ramiona",rest:90,title:"4 · Biceps + triceps",rule:"superseria · do upadku",min:false,
     ex:[{key:"biceps",label:"Biceps",opts:BIC,def:0,sets:2,lo:8,hi:15,unit:"kg",step:1},
         {key:"triceps",label:"Triceps",opts:TRI,def:1,sets:2,lo:8,hi:15,unit:"kg",step:2.5}]}}
function legacyPlan(type){
  if(type==="Dom") return [
    {id:"dom",title:"Dom · EMOM 24 min",rule:"4 rundy × 6 min · reszta minuty = odpoczynek",
     ex:[{key:"swing",label:"Min 1",opts:["Swingi"],def:0,sets:4,lo:20,hi:20,unit:"kg",step:4,noProg:true},
         {key:"bulg",label:"Min 2–3 · lewa, potem prawa",opts:["Wykroki bułgarskie (na nogę)"],def:0,sets:4,lo:8,hi:10,unit:"kg",step:4,noProg:true},
         {key:"krow",label:"Min 4",opts:["Wiosłowanie kettlem (na stronę)"],def:0,sets:4,lo:10,hi:12,unit:"kg",step:4,noProg:true},
         {key:"kohp",label:"Min 5",opts:["Wyciskanie kettla nad głowę (na stronę)","Push press (na stronę)"],def:0,sets:4,lo:6,hi:10,unit:"kg",step:4,noProg:true},
         {key:"pomp",label:"Min 6 · 1–2 przed upadkiem",opts:["Pompki","Pompki – nogi wyżej"],def:0,sets:4,lo:12,hi:25,unit:"kg",step:2.5,noProg:true}]}
  ];
  const A=type==="A", C=type==="C", up=4;
  const sila=A?{key:"silaA",label:"Zawias",opts:["Martwy ciąg"],def:0,sets:4,lo:3,hi:5,unit:"kg",step:2.5}
    :C?{key:"silaC",label:"Zawias / nogi",opts:["RDL","Suwnica","Przysiad hack"],def:0,sets:4,lo:6,hi:10,unit:"kg",step:2.5}
    :{key:"silaB",label:"Przysiad",opts:["Przysiad hack","Suwnica","Przysiad ze sztangą"],def:0,sets:4,lo:5,hi:6,unit:"kg",step:2.5};
  return [
    {id:"skoki",rest:60,title:"0 · Skoki",rule:"maks. wysokość · zejście krokiem · odpoczynek 1 min",nofail:true,min:false,
     ex:[{key:"skoki",label:"Moc",opts:["Wskok na skrzynię","Skok w dal"],def:0,sets:3,lo:5,hi:5,unit:"cm",step:5,noProg:true}]},
    {id:"sila",rest:180,title:"1 · Siła",rule:"RIR 1–2 · nie do upadku",nofail:true,min:true,ex:[sila]},
    {id:"gora",rest:150,title:"2 · Klatka + plecy",rule:"superseria · 1 RIR, upadek tylko w ostatniej serii",min:true,
     ex:[{key:"klatka",label:"Klatka",opts:KLATKA,def:A?0:C?1:2,sets:up,lo:6,hi:10,unit:"kg",step:2.5},
         {key:"plecy",label:"Plecy",opts:PLECY,def:A?0:C?2:1,sets:up,lo:6,hi:10,unit:"kg",step:2.5}]},
    {id:"nogi",rest:90,title:"3 · Nogi + boki barków",rule:"superseria · do upadku",min:false,
     ex:[{key:"nogi",label:A?"Nogi · po martwym: przód uda":C?"Nogi · po RDL: przód uda · po suwnicy/hacku: tył uda":"Nogi · po przysiadzie: tył uda",opts:[...PROST,...UGIN],def:C||A?0:1,sets:3,lo:8,hi:12,unit:"kg",step:2.5},
         {key:"barki",label:"Barki",opts:[...BOKI,...TYL],def:A?0:C?2:1,sets:3,lo:10,hi:15,unit:"kg",step:1}]},
    arms(),
    {id:"brzuch",rest:60,title:"5 · Brzuch (jeśli jest czas)",rule:"opcjonalnie · 2 serie",min:false,
     ex:[{key:"brzuch",label:"Brzuch",opts:ABS,def:0,sets:2,lo:10,hi:20,unit:"kg",step:2.5,noProg:true}]}
  ];
}
// ---------- Plan jako dane (edytowalny) ----------
const IGOR_NOTE="Dzień po dniu: nie rób C po A ani A po C (dwa razy zawias).";
function defaultPlan(){return {v:1,note:GMODE()?"":IGOR_NOTE,sessions:["A","B","C"].map(id=>({id,name:id,slots:JSON.parse(JSON.stringify(legacyPlan(id)))}))}}
function plan(type){if(type==="Dom")return legacyPlan("Dom");const se=PLAN.sessions.find(x=>x.id===type);return se?se.slots:[]}
const sessionIds=()=>PLAN.sessions.map(x=>x.id);
const sessionName=id=>{const se=PLAN.sessions.find(x=>x.id===id);return se?se.name:id};
const START={"Martwy ciąg":110,"Brzuszki na maszynie":20,"Spięcia na linie":20,"Deska (sek.)":0,"Tabata brzuch (rundy)":0,"Wyciskanie hantli – skos":27.5,"Suwnica":150,"Podciąganie":0,"Wskok na skrzynię":60,"Skok w dal":220,"RDL":80,"Prostowanie nóg (maszyna)":50,"Uginanie nóg siedząc (maszyna)":40,

  const s7=strength().filter(e=>t(e)>=d7).length,s28=strength().filter(e=>t(e)>=d28).length,r28=entries.filter(e=>e.kind==="bieg"&&t(e)>=d28).length;
  let h=`<section class="card"><h2>Regularność</h2><div class="stats num">
    <div class="stat"><b>${s7}</b><span>treningi · 7 dni</span></div><div class="stat"><b>${s28}</b><span>treningi · 28 dni</span></div><div class="stat"><b>${r28}</b><span>biegi · 28 dni</span></div></div>
    <p class="hint">Cel: 8 treningów i 4–8 biegów na 28 dni.</p></section>`;
  const best={},latest={};
  for(const e of strength().slice().reverse()) for(const it of (e.items||[])){
    if(e.type==="Dom"||it.key==="skoki"||!(it.w>0)) continue;
    const top=Math.max(0,...(it.sets||[]).filter(x=>x!=null).map(r=>e1rm(it.w,r))); if(!top) continue;
    best[it.ex]=Math.max(best[it.ex]||0,top); latest[it.ex]=top;
  }
  const names=Object.keys(best);
  h+=`<section class="card"><h2>Siła · szacowane 1RM</h2>`+(names.length?`<div style="overflow-x:auto"><table class="num"><thead><tr><th>Ćwiczenie</th><th class="r">Ostatnio</th><th class="r">Rekord</th></tr></thead><tbody>${names.map(n=>`<tr><td>${esc(n)}</td><td class="r">${fmt(latest[n])}</td><td class="r">${fmt(best[n])}</td></tr>`).join("")}</tbody></table></div><p class="hint">Wzór Epleya z najlepszej serii. Ćwiczenia z masą ciała pomijam.</p>`:`<p class="empty">Po pierwszym zapisanym treningu zobaczysz tu szacowane maksimum dla każdego ćwiczenia.</p>`)+`</section>`;
  h+=`<section class="card"><h2>Wpisy</h2>`;
  if(!entries.length) h+=`<p class="empty">Jeszcze nic. Zapisz pierwszy trening, bieg albo pomiar.</p>`;
  for(const e of entries.slice(0,60)){
    const dd=new Date(e.date),dt=dd.toLocaleDateString("pl-PL",{weekday:"short",day:"numeric",month:"short"})+", "+dd.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
    let body="",badge="";
    if(e.kind==="sila"){badge=`<span class="badge">${esc(e.type)}</span>${e.minimum?"minimum":""}${e.gym?" "+esc(e.gym):""}`;body=`<ul>${(e.items||[]).filter(i=>i.mode==="time"||(i.sets||[]).some(x=>x!=null)).map(i=>`<li>${esc(i.ex)}: ${i.mode==="time"?fmt(i.min||0)+" min":(i.ws&&i.ws.filter(x=>x!=null).length>1?i.ws.filter(x=>x!=null).map(fmt).join("/"):fmt(i.w))+" × "+(i.sets||[]).filter(x=>x!=null).join("/")}${i.note?" · <i>"+esc(i.note)+"</i>":""}</li>`).join("")}${e.durMin?`<li>Czas: ${e.durMin} min</li>`:""}${e.note?`<li><i>${esc(e.note)}</i></li>`:""}</ul>`}
    else if(e.kind==="bieg"){badge=`<span class="badge">Bieg</span>${esc(e.runType)}`;body=`<ul><li>${fmt(e.km)} km · ${fmt(e.min)} min${e.hr?" · "+e.hr+" bpm":""}</li></ul>`}
    else{badge=`<span class="badge">Pomiar</span>`;body=`<ul><li>${fmt(e.kg)} kg${e.waist?" · talia "+fmt(e.waist)+" cm":""}</li></ul>`}
    h+=`<div class="entry"><div class="entry-h"><span>${badge}</span><span class="num" style="font-size:13px;color:var(--muted)">${dt} ${armed===e.id?`<span class="confirm">Usunąć? <button class="del arm" data-del="${esc(e.id)}">Tak, usuń</button><button class="del" data-cancel="1">Nie</button></span>`:`${e.kind==="sila"?`<button class="del" data-edit="${esc(e.id)}">Edytuj</button>`:""}<button class="del" data-del="${esc(e.id)}">Usuń</button>`}</span></div>${body}</div>`;
  }
  h+=`</section>`;
  return h;
}

  if(a[0]==="e"){const ex=se.slots[+a[1]].ex[+a[2]],f=a[3];
    if(f==="opts"){const L=String(val).split("\n").map(x=>x.trim()).filter(Boolean);ex.opts=L.length?L:["Ćwiczenie"];ex.def=0;return}
    if(f==="unit"){delete ex.unitX;if(val==="cm"){ex.unit="cm";ex.noProg=true}else{ex.unit="kg";if(val!=="kg")ex.unitX=val}return}
    if(["sets","lo","hi"].includes(f)){ex[f]=Math.max(f==="sets"?1:0,Math.round(parse(val)||0));if(ex.hi<ex.lo)ex.hi=ex.lo;return}

function peClick(b){const a=b.dataset.pe,se=peSession(),i=+b.dataset.i,j=+b.dataset.j;
  const mv=(arr,k,d)=>{const t=k+d;if(t<0||t>=arr.length)return;[arr[k],arr[t]]=[arr[t],arr[k]]};
  if(a==="sel")peSid=b.dataset.id;
  else if(a==="addsess"){const used=new Set(PE.sessions.map(x=>x.id));let id="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").find(c=>!used.has(c))||rid("S");PE.sessions.push({id,name:id,slots:[]});peSid=id}

  else if(a==="sessup"||a==="sessdown"){const k=PE.sessions.indexOf(se);mv(PE.sessions,k,a==="sessup"?-1:1)}
  else if(a==="sladd")se.slots.push({id:rid("b"),rest:90,title:"Nowy blok",rule:"",min:false,ex:[{key:rid("e"),label:"Ćwiczenie",opts:["Wpisz nazwę"],def:0,sets:3,lo:8,hi:12,unit:"kg",step:2.5}]});

    tab="sila";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="sila"));toast("Plan zapisany");render();return}
  render()}

    <div class="tm-reps">${seg.k==="work"?esc(ex.reps):seg.k==="prep"?esc(ex.reps):"&nbsp;"}</div>
    <div class="tm-clock num">${mmss(left)}</div>
    <div class="tm-next">${nx?`Następne: <b>${esc(HB[nx.id].name)}</b>`:"Ostatnie!"}</div></div>
    <div class="tm-btns"><button id="t-pause">${T.pauseAt?"Wznów":"Pauza"}</button><button id="t-skip">Dalej ⏭</button><button id="t-stop">Koniec</button></div>`}
function tFinish(early){
  clearInterval(T.h);T.done=true;try{wake&&wake.release()}catch(e){}wake=null;
  const segs=T.seq.slice(1,T.i+(early?0:1)).filter(x=>x.k==="work");
  T.doneRounds=early?Math.floor(segs.length/tc.list.length):tc.rounds;
  if(!early){beep(988,700);vib([300,100,300,100,300])}
  $("#timer").className="timer";
  $("#timer").innerHTML=`<div></div><div class="tm-mid"><div class="tm-phase">${early?"Przerwane":"Koniec"}</div><div class="tm-ex">${early?"Zrobione rundy: "+T.doneRounds:"Dobra robota"}</div>
    <div class="tm-reps">${T.doneRounds?"Mogę odhaczyć "+T.doneRounds+" rund w dzienniku. Sprawdź powtórzenia przed zapisem.":"Brak pełnych rund do odhaczenia."}</div></div>
    <div class="two">${T.doneRounds?`<button class="primary" id="t-fill">Uzupełnij dziennik</button>`:"<div></div>"}<button class="ghost" id="t-close">Zamknij</button></div>`}
function tFill(){
  if(!draft||draft.type!=="Dom"){draft=newDraft("Dom",false);}
  const keys=new Set();
  for(const id of tc.list){const h=HB[id];if(!h.key||keys.has(h.key))continue;keys.add(h.key);const it=draft.items[h.key];if(!it)continue;
    if(h.opt)it.ex=h.opt; it.skip=false;
    for(let r=0;r<T.doneRounds;r++){if(r>=it.sets.length){it.plus=(it.plus||0)+1;it.sets.push(null)}it.sets[r]=it.r}}
  for(const s of plan("Dom"))for(const ex of s.ex)if(!keys.has(ex.key)&&draft.items[ex.key]&&!draft.items[ex.key].sets.some(x=>x!=null))draft.items[ex.key].skip=true;
  const extra=[...new Set(tc.list.filter(id=>!HB[id].key&&id!=="rest"))];
  draft.extras=draft.extras||[];
  for(const id of extra){const h=HB[id],sec=/do końca interwału/.test(h.reps),r=sec?tc.work:(h.n||10);
    draft.extras.push({ex:h.name+(sec?" (sek.)":""),w:h.g==="k"||h.g==="c"?20:0,r,sets:Array(T.doneRounds).fill(r),plus:Math.max(0,T.doneRounds-3)})}
  delete draft.auto;saveDraft();tClose();toast("Odhaczone. Popraw liczby, jeśli trzeba, i zapisz trening.")}
function tClose(){if(NATIVE){try{NATIVE.keepScreenOn(false)}catch(e){}}if(T&&T.h)clearInterval(T.h);try{wake&&wake.release()}catch(e){}wake=null;T=null;$("#timer").hidden=true;render()}
function timerClick(b){
  if(b.dataset.tmode){const m=TMODES[b.dataset.tmode];tc.mode=b.dataset.tmode;tc.work=m.work;tc.rest=m.rest;tc.rounds=m.rounds;saveTc();render();return true}
  if(b.dataset.tadd){tc.list.push(b.dataset.tadd);saveTc();render();return true}
  if(b.dataset.tdel){tc.list.splice(+b.dataset.tdel,1);saveTc();render();return true}
  if(b.dataset.tup){const i=+b.dataset.tup;[tc.list[i-1],tc.list[i]]=[tc.list[i],tc.list[i-1]];saveTc();render();return true}
  if(b.id==="t-addc"){const v=($("#t-custom").value||"").trim();if(v){tc.list.push("c:"+v);saveTc();render()}return true}
  if(b.id==="t-preset"){tc=tdef();saveTc();render();return true}
  if(b.id==="t-start"){tStart();return true}
  if(b.id==="t-pause"){if(T.pauseAt){T.t0+=Date.now()-T.pauseAt;T.pauseAt=0}else T.pauseAt=Date.now();tTick();return true}
  if(b.id==="t-skip"){const seg=T.seq[T.i];T.t0=tNow()-seg.dur*1000;tTick();return true}
  if(b.id==="t-stop"){tFinish(true);return true}
  if(b.id==="t-fill"){tFill();return true}
  if(b.id==="t-close"){tClose();return true}
  return false}

// ---------- Events ----------
function findEx(key){if(key[0]==="x")return XEX;for(const s of plan(draft.type)) for(const ex of s.ex) if(ex.key===key) return ex}
function itemOf(key){return key[0]==="x"?draft.extras[+key.slice(1)]:draft.items[key]}
const bf=()=>ls.get("bieg-form",{t:"Spokojny",km:8,min:48});
const pf=()=>{const lastM=entries.find(e=>e.kind==="pomiar");return ls.get("pom-form",{kg:lastM?lastM.kg:(GMODE()?75:80.6),waist:lastM?lastM.waist:(GMODE()?null:84)})};
function bump(id,dir){
  if(id.startsWith("t-")){const f=id.slice(2),st=f==="rounds"?1:f==="work"&&tc.mode==="emom"?15:5;tc[f]=Math.max(f==="rest"?0:1,(tc[f]||0)+dir*st);saveTc();render();return}
  if(tab==="sila"&&id.startsWith("m-")){const it=itemOf(id.slice(2));it.min=Math.max(0,(it.min||0)+dir);saveDraft();render();return}
  if(tab==="sila"){const [kind,key]=id.split("-"),ex=findEx(key),it=itemOf(key);
    if(kind==="w")it.w=Math.max(0,Math.round(((it.w||0)+dir*ex.step)*10)/10); else it.r=Math.max(1,(it.r||0)+dir*(repUnit(it.ex)==="sek."?5:1)); saveDraft()}
  else if(tab==="bieg"){const b=bf(); if(id==="km")b.km=Math.max(0,Math.round(((b.km||0)+dir*0.5)*10)/10); else if(id==="hr")b.hr=Math.max(0,(b.hr||140)+dir); else b.min=Math.max(0,(b.min||0)+dir); ls.set("bieg-form",b)}
  else if(tab==="pomiar"){const f=pf(); if(id==="kg")f.kg=Math.round(((f.kg||80)+dir*0.1)*10)/10; else {const lw=(entries.find(e=>e.kind==="pomiar"&&e.waist)||{}).waist||84; f.waist=f.waist==null?lw:Math.round((f.waist+dir*0.5)*10)/10;} ls.set("pom-form",f)}
  render();
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(timerClick(b)) return;
  if(b.dataset.rdec||b.dataset.rinc){const id=b.dataset.rdec||b.dataset.rinc,sl=plan(draft.type).find(x=>x.id===id);restCfg[id]=Math.max(15,restFor(sl)+(b.dataset.rinc?15:-15));ls.set("rest-cfg",restCfg);render();return}
  if(b.dataset.rgo){const sl=plan(draft.type).find(x=>x.id===b.dataset.rgo);startRest(restFor(sl));return}
  if(b.id==="open-setup"){tab="setup";render();return}
  if(b.id==="open-plan"){PE=null;tab="planed";render();window.scrollTo(0,0);return}
  if(b.dataset.pe){peClick(b);return}
  if(b.id==="g-login"){if(NATIVE&&!NAUTH()){toast("Zaktualizuj aplikację na Androida (pobierz nowy plik .apk), żeby logować się przez Google.");return}
    b.disabled=true;b.textContent="Łączę…";
    try{await gLogin("select_account");const email=await gEmail();const prev=cfg;cfg={mode:"google",email:email};if(prev.mode==="google"&&prev.email===email&&prev.sheetId)cfg.sheetId=prev.sheetId;ls.set("cfg",cfg);
      if(prev.mode!=="google"||prev.email!==email){ls.del("cache");ls.del("queue");ls.del("draft");draft=null}
      await gEnsureSheet();needLogin=false;tab="sila";toast("Połączono z Twoim arkuszem");location.reload()}
    catch(e){toast("Nie udało się zalogować"+(e&&e.message?": "+e.message:""));b.disabled=false;b.textContent="Zaloguj przez Google"}
    return}
  if(b.id==="g-logout"){ls.del("gtok");ls.del("cache");ls.del("queue");ls.del("draft");ls.set("cfg",{url:"",key:""});location.reload();return}
  if(b.id==="open-settings"){prevTab=tab==="settings"?prevTab:tab;tab="settings";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected","false"));render();return}
  if(b.id==="close-settings"){tab=prevTab||"sila";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===tab));render();return}
  if(b.id==="cfg-save"){const u=$("#cfg-url").value.trim(),k=$("#cfg-key").value.trim(); if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){toast("Adres musi zaczynać się od https://script.google.com i kończyć na /exec");return}
    b.disabled=true;b.textContent="Sprawdzam…";
    try{const r=await fetch(u+"?action=data&key="+encodeURIComponent(k));const j=await r.json();if(!j.ok)throw new Error(j.error);cfg={url:u,key:k,mode:"script"};ls.set("cfg",cfg);tab="sila";toast("Połączono z arkuszem");load()}
    catch(e){toast(String(e&&e.message)==="key"?"Zły klucz dostępu":"Nie udało się połączyć. Sprawdź adres i wdrożenie (dostęp: Każdy).");b.disabled=false;b.textContent="Połącz"}
    return}
  if(b.dataset.inc) return bump(b.dataset.inc,1);
  if(b.dataset.dec) return bump(b.dataset.dec,-1);
  if(b.dataset.type){ if(b.dataset.type!==draft.type){ if(draftHasSets()&&!b.dataset.ok){ toast("Masz niezapisane serie. Zapisz albo wyczyść trening."); return } draft=newDraft(b.dataset.type,draft.minimum); saveDraft(); render() } return }
  if(b.id==="minimum"){draft.minimum=!draft.minimum;saveDraft();render();return}
  if(b.dataset.ex){const key=b.dataset.ex,ex=findEx(key),old=draft.items[key],fresh=freshItem(ex,b.dataset.name);fresh.sets=old.sets;fresh.plus=old.plus;draft.items[key]=fresh;saveDraft();render();return}
  if(b.dataset.skip){const k=b.dataset.skip; if(k[0]==="x")draft.extras.splice(+k.slice(1),1); else draft.items[k].skip=true; saveDraft(); render(); return}
  if(b.dataset.unskip){draft.items[b.dataset.unskip].skip=false; saveDraft(); render(); return}
  if(b.dataset.addset){const it=itemOf(b.dataset.addset); it.plus=(it.plus||0)+1; saveDraft(); render(); return}
  if(b.dataset.other){const it=draft.items[b.dataset.other]; it.other=true; saveDraft(); render(); const el=document.querySelector(`[data-name-for="${b.dataset.other}"]`); if(el) el.focus(); return}
  if(b.id==="fill-missing"){fillMissing();saveDraft();render();toast("Dopisane. Sprawdź i kliknij Zapisz.");return}
  if(b.id==="save-anyway"){draft.checked=true;draft.skipCheck=true;saveDraft();document.getElementById("save").click();return}
  if(b.dataset.gym!==undefined&&b.classList.contains("chip")){draft.gym=b.dataset.gym;regym();saveDraft();render();return}
  if(b.id==="gym-add"){draft.gymNew=!draft.gymNew;saveDraft();render();const el=$("#gym-new");if(el)el.focus();return}
  if(b.id==="gym-ok"){const v=($("#gym-new").value||"").trim();if(v){const L=ls.get("gyms",[]);if(!L.includes(v))L.push(v);ls.set("gyms",L);draft.gym=v;regym()}draft.gymNew=false;saveDraft();render();return}
  if(b.id==="add-time"){draft.extras.push({mode:"time",ex:"",min:10,note:"",sets:[]}); saveDraft(); render(); return}
  if(b.dataset.noteopen){const it=itemOf(b.dataset.noteopen); it.noteOpen=true; saveDraft(); render(); const el=document.querySelector(`[data-note-for="${b.dataset.noteopen}"]`); if(el) el.focus(); return}
  if(b.dataset.snd){prefs.snd=b.dataset.snd;savePrefs();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}beep(880,250);render();return}
  if(b.id==="notif"){if(!("Notification" in window)){toast("Ten telefon nie obsługuje powiadomień w aplikacji");return}
    if(prefs.notif&&Notification.permission==="granted"){prefs.notif=false;savePrefs();clearNotif();render();return}
    const p=await Notification.requestPermission();if(p==="granted"){prefs.notif=true;savePrefs();statusNotif("Powiadomienia włączone","Tak będzie wyglądać status treningu",false);setTimeout(clearNotif,4000)}else toast("Brak zgody na powiadomienia. Włącz je w ustawieniach Androida dla aplikacji Trening.");render();return}
  if(b.id==="vib"){prefs.vib=!prefs.vib;savePrefs();vib(200);render();return}
  if(b.id==="add-ex"){draft.extras.push({ex:"",w:0,r:XEX.hi,sets:Array(XEX.sets).fill(null)}); saveDraft(); render(); const els=document.querySelectorAll("[data-name-for^='x']"); if(els.length) els[els.length-1].focus(); return}
  if(b.dataset.set){const it=itemOf(b.dataset.set),i=+b.dataset.i; if(it.sets[i]!=null){it.sets[i]=null;if(it.ws)it.ws[i]=null} else {if(restAt&&restDur-(Date.now()-restAt)/1000<=0)stopRest();it.sets[i]=it.r;it.ws=it.ws||[];it.ws[i]=it.w;if(!draft.start)draft.start=Date.now();const sl=slotOf(b.dataset.set);if(draft.type!=="Dom"&&roundDone(sl,i))startRest(sl?restFor(sl):90)} delete draft.auto; saveDraft(); render(); return}
  if(b.id==="reset"){setTimeout(clearNotif,120);draft=newDraft(nextType(),false);draft.auto=true;saveDraft();render();return}
  if(b.id==="save"){
    if(savingNow) return;
    if(!draft.skipCheck&&!draft.checked&&incomplete().length){draft.checked=true;saveDraft();render();const el=document.getElementById("incomplete");if(el)el.scrollIntoView({block:"center"});return}
    savingNow=true; b.disabled=true; b.textContent="Zapisuję…";
    const items=allItems().filter(([k,it])=>it.mode==="time"?it.min>0:it.sets.some(x=>x!=null)).map(([k,it])=>it.mode==="time"?{key:k,ex:it.ex,mode:"time",min:it.min,note:it.note||"",sets:[]}:{key:k,ex:it.ex,w:Math.max(it.w||0,...(it.ws||[]).filter(x=>x!=null)),ws:(it.ws||[]).slice(0,it.sets.length),sets:it.sets,note:it.note||""});
    const editId=draft.editId;
    const entry={kind:"sila",type:draft.type,minimum:draft.type!=="Dom"&&draft.minimum,items,note:(draft.gym&&draft.type!=="Dom"?"@"+draft.gym+" | ":"")+(draft.note||""),durMin:editId?draft.durMin:(draft.start?Math.round((Date.now()-draft.start)/60000):0)};
    if(editId) entry.date=draft.editDate;
    ls.del("draft"); draft=null; stopRest(); setTimeout(clearNotif,120);
    try{if(editId){await removeEntry(editId)} await addEntry(entry); toast(editId?"Poprawiono trening w arkuszu":"Zapisano w arkuszu · "+items.length+" ćw.")}
    catch(e){toast("Brak zasięgu · zapisane w telefonie, wyślę automatycznie")}
    savingNow=false; render(); return}
  if(b.dataset.run){const f=bf(); f.t=b.dataset.run; if(f.t==="Test 5 km")f.km=5; ls.set("bieg-form",f); render(); return}
  if(b.id==="save-run"){const f=bf(); b.disabled=true; try{await addEntry({kind:"bieg",runType:f.t,km:f.km,min:f.min,hr:f.hr||null}); toast("Zapisano bieg w arkuszu")}catch(e){toast("Brak zasięgu · bieg czeka w kolejce")} render(); return}
  if(b.id==="save-pom"){const f=pf(); b.disabled=true; try{const dt=f.dt?new Date(f.dt):new Date(); await addEntry({kind:"pomiar",kg:f.kg,waist:f.waist,date:dt.toISOString()}); toast("Zapisano pomiar w arkuszu")}catch(e){toast("Brak zasięgu · pomiar czeka w kolejce")} const g=pf(); g.waist=null; delete g.dt; ls.set("pom-form",g); render(); return}
  if(b.dataset.edit){const e=entries.find(x=>x.id===b.dataset.edit);if(!e)return;if(draftHasSets()&&!draft.editId){toast("Masz niezapisany trening. Zapisz albo wyczyść go najpierw.");return}
    draft=draftFromEntry(e);saveDraft();tab="sila";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="sila"));render();window.scrollTo(0,0);toast("Edytujesz zapisany trening. Popraw i kliknij Zapisz zmiany.");return}
  if(b.dataset.cancel){armed=null;render();return}
  if(b.dataset.del){const id=b.dataset.del; if(armed===id){armed=null; try{await removeEntry(id); toast("Usunięto z arkusza")}catch(e){toast("Nie usunięto. Usuwanie działa tylko z internetem."); render()}} else {armed=id; render()} return}
});
document.addEventListener("change",ev=>{
  const el=ev.target; if(el.dataset&&el.dataset.pf){peField(el.dataset.pf,el);if(el.dataset.pf.endsWith(".opts")||el.dataset.pf.endsWith(".unit"))render();return} if(el.tagName!=="INPUT") return;
  if(el.dataset.nameFor){const k=el.dataset.nameFor,it=itemOf(k),name=el.value.trim(); if(name){it.ex=name; if(it.mode!=="time"){const last=lastFor(name); if(last) it.w=last.w;} it.other=false} saveDraft(); render(); return}
  const v=parse(el.value);
  if(el.id==="t-custom"||el.id==="gym-new") return;
  if(el.dataset.pf){peField(el.dataset.pf,el);if(el.dataset.pf.endsWith(".opts"))render();return}
  if(el.id==="pdt"){const f=pf();f.dt=el.value;ls.set("pom-form",f);return}
  if(el.id==="wnote"){draft.note=el.value.trim();saveDraft();return}
  if(el.dataset.noteFor){const it=itemOf(el.dataset.noteFor);it.note=el.value.trim();saveDraft();return}
  if(el.id.startsWith("m-")){const it=itemOf(el.id.slice(2));const v2=parse(el.value);if(v2!=null)it.min=Math.max(0,v2);saveDraft();render();return}
  if(el.id.startsWith("t-")){const f=el.id.slice(2);if(v!=null)tc[f]=Math.max(f==="rest"?0:1,Math.round(v));saveTc();render();return}
  if(tab==="sila"){const [kind,key]=el.id.split("-"),it=itemOf(key); if(v!=null){ if(kind==="w")it.w=Math.max(0,v); else it.r=Math.max(1,Math.round(v)); saveDraft() }}
  else if(tab==="bieg"){const b=bf(); if(v!=null) b[el.id]=v; ls.set("bieg-form",b)}
  else if(tab==="pomiar"){const f=pf(); f[el.id]=v; ls.set("pom-form",f)}
  render();
});
render(); load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
