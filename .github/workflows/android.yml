name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report errors
        if: failure()
        working-directory: android
        run: |
          msg=$(grep -E "error:|What went wrong|Could not|FAILURE|Exception" -A3 build.log | head -80 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::error title=Build failed::$msg"
      - name: Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Trening.apk
          gh release create "android-${{ github.run_number }}" Trening.apk --title "Trening Android ${{ github.run_number }}" --notes "Automatyczna wersja aplikacji na Androida." --latest
        env:
          GH_TOKEN: ${{ github.token }}
